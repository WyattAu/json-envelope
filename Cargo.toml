[package]
name = "json-envelope"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Standard API response envelope — ApiResponse<T>, ApiError, PaginationMeta with IntoResponse"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/json-envelope"
keywords = ["json", "api", "response"]
categories = ["web-programming"]
exclude = ["/target"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
http = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
proptest = "1"
criterion = { version = "0.7", features = ["html_reports"] }

[lints.rust]
unsafe_code = "forbid"

[[bench]]
name = "envelope_bench"
harness = false
