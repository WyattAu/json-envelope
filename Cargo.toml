[package]
name = "json-envelope"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Standard API response envelope — ApiResponse<T>, ApiError, PaginationMeta with IntoResponse"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/json-envelope"
keywords = ["json", "api", "response"]
categories = ["web-programming"]
exclude = ["/target"]

[dependencies]
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
axum = { version = "0.8", optional = true, default-features = false, features = ["json"] }

[features]
default = []
# Axum IntoResponse adapter (std-bound by nature of axum).
axum = ["dep:axum"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
proptest = "1"
criterion = { version = "0.7", features = ["html_reports"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[[bench]]
name = "envelope_bench"
harness = false
