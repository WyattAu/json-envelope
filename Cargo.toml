[package]
name = "json-envelope"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Standard API response envelope — ApiResponse<T>, ApiError, PaginationMeta with IntoResponse"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/json-envelope"
keywords = ["json", "api", "response"]
categories = ["web-programming"]
exclude = ["/target"]

[dependencies]
# Thin re-export shim over `api-types`, which is now the single envelope story
# (JSend envelope + PaginationMeta + utoipa + RFC 7807 + proptest/fuzz).
api-types = { version = "0.1", path = "../api-types" }

[features]
default = []
# Axum IntoResponse adapter passthrough (see `api-types`).
axum = ["api-types/axum"]
# OpenAPI (`utoipa::ToSchema`) derive passthrough.
openapi = ["api-types/openapi"]

[dev-dependencies]
proptest = "1"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
